<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FEE500">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>얼마내쏘 · 경조사 장부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<script src="cloudSync.js"></script>
<style>
  :root{
    --bg:#F7F4EA;
    --card:#FFFFFF;
    --point:#FEE500;
    --on-point:#3C1E1E;
    --text:#191919;
    --sub:#8B8B8B;
    --line:#E8E4D8;
    --give:#8B8B8B;   /* 냄 (회색) */
    --receive:#2C7BE5;/* 받음 (파랑) */
    --danger:#E5484D;
    --shadow:0 1px 3px rgba(60,30,30,.05), 0 1px 2px rgba(60,30,30,.04);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    word-break:keep-all;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;}

  /* ===== 컨테이너 ===== */
  .app{
    max-width:375px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  @media(min-width:376px){
    body{background:#EDE9DC;}
    .app{
      box-shadow:0 0 40px rgba(0,0,0,.06);
      min-height:100vh;
    }
  }

  /* ===== 헤더 ===== */
  .header{
    position:sticky;top:0;z-index:40;
    background:var(--point);
    color:var(--on-point);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .header-left{display:flex;align-items:center;gap:8px;}
  .header-right{display:flex;align-items:center;gap:4px;}
  .header h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.02em;}
  .sync-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;
    background:rgba(60,30,30,.09);color:var(--on-point);cursor:pointer;
    transition:all .2s;
  }
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#8B8B8B;display:inline-block;}
  .sync-badge.synced .sync-dot{background:#28A745;}
  .sync-badge.local .sync-dot{background:#FFB300;}
  .sync-badge.disconnected .sync-dot{background:#FD7E14;}
  .sync-badge.error .sync-dot{background:#DC3545;}
  .sync-badge.connecting .sync-dot{background:#17A2B8;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  
  .user-btn{
    width:34px;height:34px;border-radius:50%;overflow:hidden;
    border:1.5px solid rgba(60,30,30,.2);display:flex;align-items:center;justify-content:center;
    background:#fff;
  }
  .user-avatar{width:100%;height:100%;object-fit:cover;}
  .menu-btn{
    width:44px;height:44px;margin:-8px -10px -8px 0;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:var(--on-point);border-radius:12px;
  }
  .menu-btn:active{background:rgba(60,30,30,.08);}

  /* 드롭다운 내 프로필 카드 */
  .menu-user-card{
    padding:14px 16px;background:#FCFBF6;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .menu-user-card img{width:38px;height:38px;border-radius:50%;object-fit:cover;}
  .menu-user-name{font-size:14px;font-weight:800;color:var(--text);}
  .menu-user-group{font-size:12px;font-weight:600;color:var(--receive);display:flex;align-items:center;gap:3px;}

  /* 팝업 모달 공통 */
  .modal-scrim{
    position:fixed;inset:0;z-index:70;background:rgba(25,25,25,.5);
    display:none;align-items:center;justify-content:center;padding:24px;
    backdrop-filter:blur(2px);
  }
  .modal-scrim.show{display:flex;}
  .modal-box{
    background:var(--card);border-radius:20px;padding:24px 20px 20px;width:100%;max-width:340px;
    box-shadow:0 14px 45px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto;
  }
  .modal-box h3{font-size:17px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em;}
  .modal-box p{font-size:13px;color:var(--sub);margin:0 0 16px;line-height:1.5;}
  .modal-section{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;}
  .modal-section-title{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;}
  .invite-code-display{font-size:24px;font-weight:900;letter-spacing:.08em;color:var(--on-point);text-align:center;padding:6px 0;}
  .modal-btn-row{display:flex;gap:8px;}
  .modal-btn-row button{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:700;}
  .btn-point{background:var(--point);color:var(--on-point);font-weight:800;}
  .btn-sub{background:var(--card);border:1px solid var(--line);color:var(--text);}

  /* ===== 검색 ===== */
  .search-wrap{padding:12px 16px 8px;background:var(--bg);}
  .search-box{
    position:relative;
  }
  .search-box svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--sub);pointer-events:none;
  }
  .search-box input{
    width:100%;height:46px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:0 40px 0 42px;font-size:15px;color:var(--text);
    outline:none;
  }
  .search-box input:focus{border-color:var(--point);}
  .search-clear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:38px;height:38px;display:none;align-items:center;justify-content:center;
    color:var(--sub);font-size:18px;border-radius:10px;
  }
  .search-clear.show{display:flex;}

  /* ===== 요약 카드 ===== */
  .summary{
    margin:4px 16px 4px;
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px 8px 12px;
    display:none;
  }
  .summary.show{display:block;}
  .summary-grid{display:flex;text-align:center;}
  .summary-cell{flex:1;padding:0 4px;position:relative;}
  .summary-cell + .summary-cell::before{
    content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line);
  }
  .summary-cell .label{font-size:12px;color:var(--sub);margin-bottom:4px;}
  .summary-cell .val{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .summary-cell .val.receive{color:var(--receive);}
  .summary-cell .val.give{color:var(--give);}
  .summary-cell .val.diff-pos{color:var(--receive);}
  .summary-cell .val.diff-neg{color:var(--danger);}
  .summary-msg{
    margin-top:12px;text-align:center;font-size:13px;font-weight:600;
    padding:8px;border-radius:10px;background:var(--bg);color:var(--on-point);
  }
  .summary-msg.neg{color:var(--danger);background:#FDECEC;}
  .summary-msg.pos{color:var(--receive);background:#EAF2FD;}

  /* ===== 필터 칩 ===== */
  .chips-scroll{
    display:flex;gap:8px;overflow-x:auto;padding:8px 16px 12px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .chips-scroll::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;height:36px;padding:0 15px;border-radius:18px;
    background:var(--card);border:1px solid var(--line);
    font-size:14px;font-weight:600;color:var(--sub);
    display:flex;align-items:center;white-space:nowrap;
  }
  .chip.active{background:var(--point);border-color:var(--point);color:var(--on-point);font-weight:700;}

  /* ===== 목록 ===== */
  .list{
    flex:1;padding:2px 16px 120px;
  }
  .rec-card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px;margin-bottom:10px;
    display:flex;align-items:center;gap:12px;
    position:relative;
  }
  .rec-card:active{background:#FCFBF6;}
  .rec-main{flex:1;min-width:0;}
  .rec-top{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
  .rec-name{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .badge{
    font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;
    background:var(--bg);color:var(--sub);border:1px solid var(--line);
  }
  .rec-sub{font-size:13px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .rec-sub .dot{color:var(--line);}
  .rec-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .rec-amount{font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;}
  .rec-amount.receive{color:var(--receive);}
  .rec-amount.give{color:var(--give);}
  .del-btn{
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    color:var(--sub);border-radius:8px;
  }
  .del-btn:active{background:#FDECEC;color:var(--danger);}
  .del-btn svg{width:17px;height:17px;}

  /* ===== 빈 상태 ===== */
  .empty{
    padding:40px 24px 120px;text-align:center;
  }
  .empty-icon{font-size:52px;margin-bottom:12px;}
  .empty h2{font-size:18px;font-weight:800;margin:0 0 8px;}
  .empty p{font-size:14px;color:var(--sub);margin:0 0 24px;line-height:1.6;}
  .empty .rec-card{opacity:.45;text-align:left;pointer-events:none;filter:saturate(.6);}
  .empty-label{font-size:12px;color:var(--sub);margin:20px 0 8px;font-weight:600;}
  .empty-cta{
    margin-top:26px;height:50px;border-radius:14px;background:var(--point);color:var(--on-point);
    font-size:16px;font-weight:800;width:100%;
  }
  .empty-cta:active{filter:brightness(.96);}

  /* ===== FAB ===== */
  .fab{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 20px);
    z-index:45;
    height:54px;padding:0 26px 0 22px;border-radius:27px;
    background:var(--point);color:var(--on-point);
    font-size:16px;font-weight:800;
    display:flex;align-items:center;gap:6px;
    box-shadow:0 6px 20px rgba(254,229,0,.5),0 2px 6px rgba(60,30,30,.15);
    max-width:343px;
  }
  .fab:active{filter:brightness(.96);transform:translateX(-50%) scale(.98);}
  .fab .plus{font-size:22px;font-weight:800;line-height:1;margin-top:-1px;}

  /* ===== 시트 (입력) ===== */
  .scrim{
    position:fixed;inset:0;z-index:50;background:rgba(25,25,25,.4);
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  .scrim.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);
    z-index:55;width:100%;max-width:375px;
    background:var(--bg);
    border-radius:20px 20px 0 0;
    max-height:92vh;max-height:92dvh;overflow-y:auto;
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    padding-bottom:calc(env(safe-area-inset-bottom) + 16px);
    -webkit-overflow-scrolling:touch;
  }
  .sheet.show{transform:translateX(-50%) translateY(0);}
  .sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0;}
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 16px 4px;position:sticky;top:0;background:var(--bg);z-index:2;
  }
  .sheet-head h2{font-size:18px;font-weight:800;margin:0;}
  .sheet-close{width:44px;height:44px;margin:-8px -10px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:24px;border-radius:12px;}
  .sheet-close:active{background:var(--line);}
  .sheet-body{padding:8px 16px 16px;}

  .field{margin-bottom:18px;}
  .field > label{display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;}
  .field > label .opt{color:var(--sub);font-weight:500;font-size:12px;}

  /* 방향 토글 */
  .dir-toggle{display:flex;gap:10px;}
  .dir-btn{
    flex:1;height:64px;border-radius:14px;border:2px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:15px;font-weight:700;color:var(--sub);transition:all .12s;
  }
  .dir-btn .emoji{font-size:20px;}
  .dir-btn[data-dir="give"].active{border-color:var(--give);color:var(--give);background:#F6F6F6;}
  .dir-btn[data-dir="receive"].active{border-color:var(--receive);color:var(--receive);background:#EAF2FD;}

  .text-input,.date-input{
    width:100%;height:48px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:0 14px;font-size:15px;color:var(--text);outline:none;
  }
  .text-input:focus,.date-input:focus{border-color:var(--point);}

  /* 자동완성 */
  .autocomplete{position:relative;}
  .ac-list{
    position:absolute;left:0;right:0;top:52px;z-index:5;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.1);overflow:hidden;display:none;
  }
  .ac-list.show{display:block;}
  .ac-item{padding:11px 14px;font-size:15px;border-bottom:1px solid var(--line);}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:active{background:var(--bg);}

  /* 선택 칩 그룹 */
  .chip-group{display:flex;flex-wrap:wrap;gap:8px;}
  .sel-chip{
    height:40px;padding:0 14px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);
    font-size:14px;font-weight:600;color:var(--sub);
    display:flex;align-items:center;
  }
  .sel-chip.active{background:var(--point);border-color:var(--point);color:var(--on-point);font-weight:700;}

  /* 금액 */
  .amount-input{
    width:100%;height:56px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:0 46px 0 14px;
    font-size:22px;font-weight:800;color:var(--text);outline:none;text-align:right;
    letter-spacing:-.01em;
  }
  .amount-wrap{position:relative;}
  .amount-wrap .won{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    font-size:16px;font-weight:700;color:var(--sub);pointer-events:none;
  }
  .amount-input:focus{border-color:var(--point);}
  .quick-amt{display:flex;gap:8px;margin-top:10px;}
  .quick-amt button{
    flex:1;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);
    font-size:13px;font-weight:700;color:var(--text);
  }
  .quick-amt button:active{background:var(--point);border-color:var(--point);}

  /* 물가 반영 추천 박스 */
  .reco-box{
    margin-top:12px;padding:13px 14px;border-radius:12px;
    background:#FFFBE6;border:1px solid #F3E39A;
  }
  .reco-box .reco-head{
    display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
    font-size:13px;font-weight:700;color:var(--on-point);
  }
  .reco-box .reco-amt{font-size:19px;font-weight:800;letter-spacing:-.02em;}
  .reco-box .reco-sub{font-size:12px;color:#9A7B2E;margin-top:4px;line-height:1.5;}
  .reco-box .reco-add{
    width:100%;height:44px;margin-top:11px;border-radius:11px;
    background:var(--point);color:var(--on-point);font-size:14px;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .reco-box .reco-add:active{filter:brightness(.96);}

  .save-btn{
    width:100%;height:54px;border-radius:14px;background:var(--point);color:var(--on-point);
    font-size:17px;font-weight:800;margin-top:6px;
  }
  .save-btn:active{filter:brightness(.96);}
  .save-btn:disabled{opacity:.4;}

  /* ===== 드롭다운 메뉴 ===== */
  .dropdown{
    position:absolute;top:calc(env(safe-area-inset-top) + 52px);right:12px;z-index:60;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 8px 28px rgba(0,0,0,.15);overflow:hidden;min-width:170px;
    display:none;
  }
  .dropdown.show{display:block;animation:pop .14s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  .dropdown button{
    width:100%;text-align:left;padding:13px 16px;font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);
  }
  .dropdown button:last-child{border-bottom:none;}
  .dropdown button:active{background:var(--bg);}
  .dropdown button svg{width:17px;height:17px;color:var(--sub);}

  /* ===== 확인 다이얼로그 ===== */
  .confirm-scrim{
    position:fixed;inset:0;z-index:70;background:rgba(25,25,25,.45);
    display:none;align-items:center;justify-content:center;padding:32px;
  }
  .confirm-scrim.show{display:flex;}
  .confirm-box{
    background:var(--card);border-radius:16px;padding:22px 20px 16px;width:100%;max-width:300px;text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.2);
  }
  .confirm-box h3{font-size:16px;font-weight:800;margin:0 0 6px;}
  .confirm-box p{font-size:13px;color:var(--sub);margin:0 0 18px;line-height:1.5;}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions button{flex:1;height:46px;border-radius:12px;font-size:15px;font-weight:700;}
  .btn-cancel{background:var(--bg);color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}

  /* ===== 토스트 ===== */
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);
    z-index:80;background:var(--text);color:#fff;padding:11px 18px;border-radius:22px;
    font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .no-result{text-align:center;color:var(--sub);font-size:14px;padding:40px 0;}
</style>
</head>
<body>
<div class="app">
  <!-- 헤더 -->
  <header class="header">
    <div class="header-left">
      <h1>얼마내쏘</h1>
      <span class="sync-badge local" id="syncBadge" title="클라우드 동기화 상태 (클릭 시 설정)">
        <span class="sync-dot"></span><span id="syncText">로컬</span>
      </span>
    </div>
    <div class="header-right">
      <button class="user-btn" id="userBtn" aria-label="프로필" style="display:none">
        <img src="" id="userAvatar" class="user-avatar" alt="프로필">
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="메뉴">⋯</button>
    </div>
  </header>

  <!-- 검색 -->
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="search" placeholder="이름으로 검색" autocomplete="off">
      <button class="search-clear" id="searchClear" aria-label="지우기">✕</button>
    </div>
  </div>

  <!-- 요약 카드 -->
  <div class="summary" id="summary">
    <div class="summary-grid">
      <div class="summary-cell"><div class="label">받은 금액</div><div class="val receive" id="sumReceive">0</div></div>
      <div class="summary-cell"><div class="label">낸 금액</div><div class="val give" id="sumGive">0</div></div>
      <div class="summary-cell"><div class="label">차액</div><div class="val" id="sumDiff">0</div></div>
    </div>
    <div class="summary-msg" id="sumMsg"></div>
  </div>

  <!-- 필터 칩 -->
  <div class="chips-scroll" id="filterChips"></div>

  <!-- 목록 -->
  <div class="list" id="list"></div>
</div>

<!-- FAB -->
<button class="fab" id="fab"><span class="plus">+</span> 기록 추가</button>

<!-- 드롭다운 메뉴 -->

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  const STORAGE_KEY = 'gyeongjosa_records';
  const RELATIONS = ['직장','친구','친척','기타'];
  const CATEGORIES = ['결혼','돌·백일','장례','출산','개업','기타'];

  // 연도별 소비자물가지수(CPI, 2020=100 기준, 근사값). 매년 갱신 권장.
  const CPI = {
    2005:74.4, 2006:76.0, 2007:77.9, 2008:81.6, 2009:83.9,
    2010:86.4, 2011:89.8, 2012:91.8, 2013:93.0, 2014:94.2,
    2015:94.9, 2016:95.8, 2017:97.7, 2018:99.1, 2019:99.5,
    2020:100.0, 2021:102.5, 2022:107.7, 2023:111.6, 2024:114.2,
    2025:116.5, 2026:118.8
  };
  const CPI_YEARS = Object.keys(CPI).map(Number).sort((a,b)=>a-b);
  const CPI_MIN = CPI_YEARS[0];
  const CPI_MAX = CPI_YEARS[CPI_YEARS.length-1];
  function cpiFor(y){
    const yy = Math.max(CPI_MIN, Math.min(CPI_MAX, y));
    return CPI[yy];
  }
  function curCpiYear(){ return Math.min(new Date().getFullYear(), CPI_MAX); }
  // 원금(amount)을 기록연도(year) 기준에서 올해 가치로 환산 → 가까운 만원으로 반올림
  function recommend(amount, year){
    const cur = curCpiYear();
    if(!year || year >= cur) return null;         // 올해/미래 기록은 추천 안 함
    const base = cpiFor(year), now = cpiFor(cur);
    if(!base || !now) return null;
    const raw = amount * now / base;
    const rounded = Math.round(raw/10000)*10000;  // 만원 단위 반올림
    if(rounded <= 0) return null;
    return { rounded, raw, curYear: cur };
  }

  // ===== 상태 =====
  let records = load();
  let activeFilter = '전체';
  let searchTerm = '';
  let editingId = null;         // null이면 추가, 값 있으면 수정
  let form = { direction:'give', name:'', relation:'', category:'', amount:0, date:'', memo:'' };
  let pendingDeleteId = null;

  // ===== 유틸 =====
  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }
  function comma(n){
    return (n||0).toLocaleString('ko-KR');
  }
  function todayStr(){
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
  }
  function fmtDate(s){
    if(!s) return '';
    const [y,m,d] = s.split('-');
    return `${y}.${m}.${d}`;
  }
  function esc(s){
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  // ===== 목록 렌더 =====
  const listEl = document.getElementById('list');
  const summaryEl = document.getElementById('summary');

  function filteredRecords(){
    let list = records.slice();
    if(searchTerm){
      const q = searchTerm.toLowerCase();
      list = list.filter(r => (r.name||'').toLowerCase().includes(q));
    }
    if(activeFilter !== '전체'){
      list = list.filter(r => r.category === activeFilter);
    }
    // 최신순: 날짜 desc, 같으면 id desc
    list.sort((a,b)=>{
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return Number(b.id) - Number(a.id);
    });
    return list;
  }

  function renderSummary(){
    if(!searchTerm){ summaryEl.classList.remove('show'); return; }
    // 검색어에 해당하는 인물의 기록으로 요약 (필터칩 무시하고 사람 기준)
    const q = searchTerm.toLowerCase();
    const personRecs = records.filter(r => (r.name||'').toLowerCase().includes(q));
    let recv = 0, give = 0;
    personRecs.forEach(r=>{
      if(r.direction === 'receive') recv += r.amount;
      else give += r.amount;
    });
    const diff = recv - give; // 받은 - 낸
    document.getElementById('sumReceive').textContent = comma(recv);
    document.getElementById('sumGive').textContent = comma(give);
    const diffEl = document.getElementById('sumDiff');
    diffEl.textContent = (diff>0?'+':'') + comma(diff);
    diffEl.className = 'val ' + (diff>0?'diff-pos':(diff<0?'diff-neg':''));

    const msg = document.getElementById('sumMsg');
    if(personRecs.length === 0){
      msg.textContent = '기록이 없어요';
      msg.className = 'summary-msg';
    } else if(diff < 0){
      // 내가 덜 냄 → 받은 게 적음? 스펙: 차액 마이너스(내가 덜 냄) = 아직 갚을 게 남았어요
      msg.textContent = '아직 갚을 게 남았어요';
      msg.className = 'summary-msg neg';
    } else if(diff > 0){
      msg.textContent = '내가 더 냈어요';
      msg.className = 'summary-msg pos';
    } else {
      msg.textContent = '딱 맞게 주고받았어요';
      msg.className = 'summary-msg';
    }
    summaryEl.classList.add('show');
  }

  function cardHTML(r){
    const dirClass = r.direction === 'receive' ? 'receive' : 'give';
    const sign = r.direction === 'receive' ? '+' : '-';
    const memoHTML = r.memo ? `<span class="dot">·</span><span>${esc(r.memo)}</span>` : '';
    return `
      <div class="rec-card" data-id="${r.id}">
        <div class="rec-main">
          <div class="rec-top">
            <span class="rec-name">${esc(r.name||'무명')}</span>
            ${r.relation ? `<span class="badge">${esc(r.relation)}</span>` : ''}
          </div>
          <div class="rec-sub">
            <span>${esc(r.category||'기타')}</span>
            <span class="dot">·</span>
            <span>${fmtDate(r.date)}</span>
            ${memoHTML}
          </div>
        </div>
        <div class="rec-right">
          <span class="rec-amount ${dirClass}">${sign}${comma(r.amount)}</span>
          <button class="del-btn" data-del="${r.id}" aria-label="삭제">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>`;
  }

  function renderEmpty(){
    listEl.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📖</div>
        <h2>아직 기록이 없어요</h2>
        <p>주고받은 경조사비를 기록해두면<br>다음에 챙길 때 헷갈리지 않아요.</p>
        <div class="empty-label">이렇게 기록돼요</div>
        <div class="rec-card">
          <div class="rec-main">
            <div class="rec-top"><span class="rec-name">신비한고양이</span><span class="badge">친구</span></div>
            <div class="rec-sub"><span>결혼</span><span class="dot">·</span><span>2026.05.10</span></div>
          </div>
          <div class="rec-right"><span class="rec-amount give">-100,000</span></div>
        </div>
        <div class="rec-card">
          <div class="rec-main">
            <div class="rec-top"><span class="rec-name">노랑이</span><span class="badge">직장</span></div>
            <div class="rec-sub"><span>돌·백일</span><span class="dot">·</span><span>2026.04.02</span></div>
          </div>
          <div class="rec-right"><span class="rec-amount receive">+50,000</span></div>
        </div>
        <button class="empty-cta" id="emptyCta"><span>+ 기록 추가</span></button>
      </div>`;
    document.getElementById('emptyCta').addEventListener('click', openAdd);
  }

  function render(){
    renderFilterChips();
    if(records.length === 0){
      summaryEl.classList.remove('show');
      renderEmpty();
      return;
    }
    renderSummary();
    const list = filteredRecords();
    if(list.length === 0){
      listEl.innerHTML = `<div class="no-result">${searchTerm ? '검색 결과가 없어요' : '해당 종류의 기록이 없어요'}</div>`;
      return;
    }
    listEl.innerHTML = list.map(cardHTML).join('');
  }

  // 필터 칩
  const filterChipsEl = document.getElementById('filterChips');
  function renderFilterChips(){
    const items = ['전체', ...CATEGORIES];
    filterChipsEl.innerHTML = items.map(c =>
      `<button class="chip ${c===activeFilter?'active':''}" data-filter="${esc(c)}">${esc(c)}</button>`
    ).join('');
  }

  // ===== 이벤트: 목록 영역 =====
  filterChipsEl.addEventListener('click', e=>{
    const chip = e.target.closest('[data-filter]');
    if(!chip) return;
    activeFilter = chip.dataset.filter;
    render();
  });

  listEl.addEventListener('click', e=>{
    const del = e.target.closest('[data-del]');
    if(del){
      e.stopPropagation();
      pendingDeleteId = del.dataset.del;
      const rec = records.find(r=>r.id===pendingDeleteId);
      document.getElementById('confirmMsg').textContent =
        rec ? `${rec.name||'이'} 님의 기록(${comma(rec.amount)}원)을 삭제합니다.` : '이 기록을 삭제합니다.';
      document.getElementById('confirmScrim').classList.add('show');
      return;
    }
    const card = e.target.closest('.rec-card[data-id]');
    if(card){ openEdit(card.dataset.id); }
  });

  // ===== 검색 =====
  const searchEl = document.getElementById('search');
  const searchClear = document.getElementById('searchClear');
  searchEl.addEventListener('input', ()=>{
    searchTerm = searchEl.value.trim();
    searchClear.classList.toggle('show', searchEl.value.length>0);
    render();
  });
  searchClear.addEventListener('click', ()=>{
    searchEl.value=''; searchTerm=''; searchClear.classList.remove('show'); render(); searchEl.focus();
  });

  // ===== 삭제 확인 =====
  document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
  document.getElementById('confirmScrim').addEventListener('click', e=>{
    if(e.target.id==='confirmScrim') closeConfirm();
  });
  document.getElementById('confirmOk').addEventListener('click', ()=>{
    if(pendingDeleteId){
      const delId = pendingDeleteId;
      records = records.filter(r=>r.id!==delId);
      save(); render(); toast('삭제했어요');
      if(window.CloudService && window.CloudService.getSyncState() === 'synced'){
        window.CloudService.deleteRecord(delId);
      }
    }
    closeConfirm();
  });
  function closeConfirm(){
    pendingDeleteId=null;
    document.getElementById('confirmScrim').classList.remove('show');
  }

  // ===== 드롭다운 메뉴 =====
  const dropdown = document.getElementById('dropdown');
  document.getElementById('menuBtn').addEventListener('click', e=>{
    e.stopPropagation();
    dropdown.classList.toggle('show');
  });
  document.addEventListener('click', e=>{
    if(!dropdown.contains(e.target) && e.target.id!=='menuBtn'){
      dropdown.classList.remove('show');
    }
  });

  // 내보내기
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    dropdown.classList.remove('show');
    const data = JSON.stringify(records, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `얼마내쏘_${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('백업 파일을 내보냈어요');
  });

  // 불러오기
  const importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', ()=>{
    dropdown.classList.remove('show');
    importFile.click();
  });
  importFile.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const arr = JSON.parse(ev.target.result);
        if(!Array.isArray(arr)) throw new Error('형식 오류');
        const existing = new Set(records.map(r=>String(r.id)));
        let added = 0;
        arr.forEach(r=>{
          if(r && r.id!=null && !existing.has(String(r.id))){
            records.push({
              id: String(r.id),
              name: r.name||'',
              relation: r.relation||'기타',
              category: r.category||'기타',
              direction: r.direction==='receive'?'receive':'give',
              amount: Number(r.amount)||0,
              date: r.date||todayStr(),
              memo: r.memo||''
            });
            existing.add(String(r.id));
            added++;
          }
        });
        save(); render();

      `<span class="reco-amt">${roundMan}만원</span></div>`+
      `<div class="reco-sub">${year}년 ${comma(r.amount)}원 → 현재 가치 약 ${rawMan}만원 · 만원 단위 반올림</div>`+
      `<button class="reco-add" type="button">＋ 이 금액으로 새 기록 추가</button>`;

        if(lines.length < 2) throw new Error('데이터가 부족합니다');
        
        let added = 0;
        // 첫 줄(헤더) 건너뛰고 파싱
        for(let i = 1; i < lines.length; i++){
          const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          if(cols.length >= 5){
            const dir = cols[0] === '받음' || cols[0] === 'receive' ? 'receive' : 'give';

                relation: rel,

  fDate.value = todayStr();
  render();

  // PWA 서비스 워커 등록
  if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW 등록 생략:', err));
    });
  }
})();
</script>
</body>
</html>
